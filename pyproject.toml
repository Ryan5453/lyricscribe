[project]
name = "lyricscribe"
version = "1.0.0"
description = "Tooling for ALT research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "demucs-next @ git+https://github.com/Ryan5453/demucs-next.git",
    "datasets",
    "pydantic",
]

[project.scripts]
lyricscribe = "lyricscribe.cli.main:cli"

[build-system]
requires = ["uv_build>=0.7.19,<0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lyricscribe"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.11.8",
]

[tool.uv]
package = true

[tool.ruff]
lint.extend-select = ["I"]
