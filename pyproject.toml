[project]
name = "lyricscribe"
version = "1.0.0"
description = "Tooling for ALT research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "demucs-next @ git+https://github.com/Ryan5453/demucs-next.git",
]

[project.scripts]
lyricscribe = "lyricscribe.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.11.8",
]

[tool.uv]
package = true

[tool.ruff]
lint.extend-select = ["I"]
