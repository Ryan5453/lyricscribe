[project]
name = "lyricscribe"
version = "1.0.0"
description = "Tooling for ALT research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "unblend==1.0.0",
    "datasets>=3.0",
    "pydantic",
    "transformers==5.19.0",
    "nemo_toolkit[asr]>=2.7",
    "lhotse>=1.32",
    "antlr4-python3-runtime==4.9.3",
    "silero-vad",
    "jiwer",
    "alt-eval==1.0.0",
    "matplotlib",
    "pandas",
    "peft",
    "librosa",
    "pyyaml",
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "torchcodec==0.15.0",
    # Qwen3-Omni's processor imports its video sub-processor, which needs it.
    "torchvision==0.28.0",
    "nvidia-cuda-nvcc-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-npp-cu12",
]

[project.scripts]
lyricscribe = "lyricscribe.cli.main:cli"

[build-system]
requires = ["uv_build>=0.7.19,<0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lyricscribe"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.11.8",
]

[tool.uv]
package = true
# NeMo caps hydra-core at <=1.3.2, which leaves GHSA (hydra.utils.instantiate
# code execution, high) unpatched. hydra-core 1.3.6 declares identical
# requirements to 1.3.2 (omegaconf<2.4,>=2.2, antlr4-python3-runtime==4.9.*,
# packaging), so the cap is stale rather than a compatibility constraint.
override-dependencies = ["hydra-core>=1.3.6"]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchcodec = { index = "pytorch-cu129" }

[tool.ruff]
lint.extend-select = ["I"]
