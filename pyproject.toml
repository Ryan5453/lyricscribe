[project]
name = "lyricscribe"
version = "1.0.0"
description = "Tooling for ALT research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "demucs-next @ git+https://github.com/Ryan5453/demucs-next.git",
    "datasets>=3.0",
    "pydantic",
    "transformers",
    # NeMo ≥ 2.7 is required for Canary 1B v2 — earlier versions silently
    # fall back to a plain SentencePiece tokenizer, tripping the canary2
    # prompt formatter's EOS assertion.
    "nemo_toolkit[asr]>=2.7",
    "lhotse>=1.32",
    "antlr4-python3-runtime==4.9.3",
    "silero-vad",
    "jiwer",
    "matplotlib",
    "pandas",
    # Bumped in lock-step with NeMo 2.7 (which pins torch 2.11 / cu130).
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchcodec==0.11.0",
    # NeMo's RNNT/TDT loss + CUDA-graph decoding route through Numba,
    # which needs libnvvm.so and libcudart.so at runtime. On boxes
    # without a system CUDA toolkit, pip ships these; trainer.py auto-
    # configures CUDA_HOME/LD_LIBRARY_PATH on import. Production SLURM
    # jobs typically `module load cuda/…` and ignore these.
    "nvidia-cuda-nvcc-cu12",
    "nvidia-cuda-runtime-cu12",
]

[project.scripts]
lyricscribe = "lyricscribe.cli.main:cli"

[build-system]
requires = ["uv_build>=0.7.19,<0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lyricscribe"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.11.8",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[tool.ruff]
lint.extend-select = ["I"]
